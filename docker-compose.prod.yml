# =============================================================================
# Permoney — production stack (PER-192)
# =============================================================================
# Runs alongside Sure (finance.permana.icu) and the dev `docker-compose.yml`
# stack on the same Oracle VM. Fully isolated from both: its own Compose
# project name (set via `-p permoney-prod` or COMPOSE_PROJECT_NAME, see
# docs/runbook-production.md), its own network, its own named volume.
#
# Postgres is NOT published to a host port — reachable only from the app
# container over the internal `permoney-prod` network. This is stricter than
# both the existing dev Postgres (:5433, host-published) and Sure's Postgres
# (:5435, host-published-to-loopback) on this same box.
#
# The app container publishes to 127.0.0.1:3005 only (loopback) — Caddy
# (running on the host, see /etc/caddy/Caddyfile's permana.icu block) is the
# sole ingress. This closes the direct-port-bypass pattern Sure's own
# 0.0.0.0:3000 publish has (tracked as a Phase-B hardening follow-up).
#
# See docs/adr/0047-self-hosted-production-postgres.md for the decision
# record (amends ADR-0003's rejection of self-hosted Postgres on a VPS).
# =============================================================================

services:
  postgres:
    image: postgres:16
    container_name: permoney_prod_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: permoney_admin
      # POSTGRES_PASSWORD read from the server-side .env — never committed,
      # never echoed. See docs/runbook-production.md for provisioning.
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: permoney_prod
    volumes:
      - permoney_prod_pg_data:/var/lib/postgresql/data
    networks:
      - permoney_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permoney_admin -d permoney_prod"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # No `ports:` — intentionally not host-published. See header note.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: permoney_prod_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      HOST: 0.0.0.0
      # Runtime app role (non-superuser, non-bypassrls — see
      # docs/runbook-production.md's role-provisioning step), NOT
      # POSTGRES_ADMIN_PASSWORD above. Set via server-side .env.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      # PER-235 market-data: base URL of the self-hosted logam-mulia-api gold
      # price worker (a Cloudflare Worker). Optional — the gold MarketDataProvider
      # adapter reads it at call time and fails gracefully when unset, so the app
      # still boots without it. See docs/adr/0050-market-data-ingestion.md.
      LOGAM_MULIA_API_URL: ${LOGAM_MULIA_API_URL:-}
      # PER-250 market-data: base URL of the self-hosted reksadana-nav worker
      # (workers/reksadana-nav, a Cloudflare Worker). Optional — the reksadana
      # ReksadanaNavProvider adapter reads it at call time and fails gracefully
      # when unset, so the app still boots without it. See ADR-0053.
      REKSADANA_API_URL: ${REKSADANA_API_URL:-}
      # PER-237 market-data: shared secret the host cron job
      # (deploy/refresh-market-data.sh) presents to trigger the scheduled
      # market-data refresh over loopback. Optional — unset means the
      # /api/internal/market-data-refresh route rejects every request (fails
      # closed), so the app still boots without it; the daily refresh just
      # won't run until it's set. See docs/adr/0050-market-data-ingestion.md §4.
      MARKET_DATA_REFRESH_SECRET: ${MARKET_DATA_REFRESH_SECRET:-}
      # ADR-0057 family invitations: Resend API key + from-address. Compose only
      # forwards variables listed here (there is no env_file), so without these
      # two lines a correct `.env` still never reaches the container. Optional
      # at boot — unset means the invite feature fails LOUDLY at send time (see
      # src/server/email.server.ts) rather than the app refusing to start.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    ports:
      - "127.0.0.1:3005:3005"
    networks:
      - permoney_prod_net

  # CommandCode audit finding #9 — the `app` runtime image ships ONLY the
  # traced `.output/` (see the Dockerfile's header note: no repo source, no
  # Prisma CLI, no migrations folder), so `prisma migrate deploy` can never
  # run through it. Before this service existed, every release with a
  # migration required hand-typing `docker build --target build -t
  # permoney-prod-migrator:latest .` plus a `docker run` with the migrator
  # DATABASE_URL pasted into an `-e` flag — a manual ritual with no tracked
  # definition, one skipped/mistyped step away from shipping an app version
  # against a stale schema. This service builds the SAME Dockerfile's `build`
  # stage (full node_modules + Prisma CLI + migrations/, discarded by the
  # final `app` image) as a normal, versioned Compose service instead.
  #
  # `restart: "no"` + a dedicated `migrate` profile: it must NEVER be a
  # long-running container, and a bare `docker compose up -d` (no service
  # name) must never start it — invoke it explicitly:
  #   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
  # Exits 0 with nothing to do when there are no pending migrations, so it is
  # safe to run on every deploy, migration or not.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: permoney_prod_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The MIGRATOR role, never `permoney_app` (DATABASE_URL above) — the
      # app role must never run schema migrations. See
      # docs/runbook-production.md's role-provisioning step.
      DATABASE_URL: ${PERMONEY_SEED_PRIVILEGED_DATABASE_URL:?PERMONEY_SEED_PRIVILEGED_DATABASE_URL is required to run migrations — the migrator role connection string, never permoney_app}
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    networks:
      - permoney_prod_net
    profiles:
      - migrate

  # Same rationale as `migrate` above, for `prisma/seed-production.ts`
  # (system categories only — see that file's header comment for why it must
  # never be `prisma db seed`, which also creates a demo tenant). Idempotent,
  # safe to re-run after a migration adds new system categories.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: permoney_prod_seed
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${PERMONEY_SEED_PRIVILEGED_DATABASE_URL:?PERMONEY_SEED_PRIVILEGED_DATABASE_URL is required to seed system data}
    command: ["./node_modules/.bin/tsx", "prisma/seed-production.ts"]
    networks:
      - permoney_prod_net
    profiles:
      - seed

networks:
  permoney_prod_net:
    driver: bridge

volumes:
  permoney_prod_pg_data:
