version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    # Toolchain packages that vite-plus OWNS must never be bumped by the bot:
    # vite-plus bundles its own vitest, and a mismatched coverage provider makes
    # Vitest run mixed versions and print unreliable coverage (the unit job
    # fails closed on exactly this drift). Pin it to the bundled version by hand
    # whenever vite-plus itself moves.
    ignore:
      - dependency-name: "@vitest/coverage-v8"
        # vite-plus, not npm, decides this version. See AGENTS.md ("Do not
        # install Vitest, Oxlint, Oxfmt or tsdown directly") and the
        # vite-plus bump policy further down this file.
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    # Group all non-major updates into one PR per week to reduce noise;
    # majors and security patches still come as individual PRs.
    groups:
      # NOTE — `@tanstack/start-server-core` is exactly pinned in package.json
      # (both as a dependency and in `pnpm.overrides`) so the server-fn error
      # transport is a deliberate decision, never a silent side effect of a
      # group. Since 1.169.39 a thrown server-fn error is serialized into a 200
      # JSON envelope (`x-tss-serialized`) instead of a 5xx — the client still
      # throws after deserialization, but any raw-HTTP assertion or monitor
      # must read the payload, not the status (see tests/e2e/ownership-transfer).
      tanstack:
        patterns:
          - "@tanstack/*"
      prisma:
        patterns:
          - "@prisma/*"
          - prisma
      radix:
        patterns:
          - "@radix-ui/*"
          - radix-ui
      # react and react-dom must move together: React refuses to run when the
      # two versions differ ("Incompatible React versions"), which failed every
      # component test when the bot bumped only `react` (PR #362). The types
      # pair is named explicitly here and excluded from `types` below, because
      # an overlapping pattern is resolved by whichever group matches first —
      # one atomic PR is the only reliable shape.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        patterns:
          - vitest
          - "@vitest/*"
          - "@vitejs/*"
          - "@rsbuild/*"
          - "@testing-library/*"
        exclude-patterns:
          # vite-plus (and its `vite` alias override) must NEVER be grouped
          # with routine dev-tooling bumps: a 2026-08-30 upgrade of this exact
          # package broke production with an ARM64-only SSR crash invisible to
          # x86_64 CI (see docs/adr's dependency-upgrade-hazards notes), and a
          # grouped PR silently re-bundling it recurred on 2026-09-10. Any
          # vite-plus bump must land as its own isolated, individually-Reviewed
          # PR, verified with a native ARM64 build+boot test on the prod VM
          # before merging — never auto-merged as part of a routine group.
          - vite-plus
          - vite
      better-auth:
        patterns:
          - better-auth
          - "@better-auth/*"
    labels:
      - dependencies

    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - ci
