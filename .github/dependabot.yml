# =============================================================================
# MERGE PROTOCOL — lockfile-touching Dependabot PRs (read before merging)
#
# Incident 2026-10-10: squash-merging the stale-base PR #422 textually
# duplicated the undici@7.30.0 blocks in pnpm-lock.yaml (packages: ×2,
# snapshots: ×2). GitHub reported the PR CLEAN — its merge check is textual
# only — and main went red at `pnpm install --frozen-lockfile`
# (ERR_PNPM_BROKEN_LOCKFILE: duplicated mapping key) until #433 removed the
# extra lines. CI caught it, but only after main was already broken, and a
# plain `pnpm install` would have silently "repaired" the file instead of
# failing (ci.yml therefore asserts the install leaves the lockfile untouched).
#
# 1. REBASE FIRST — never merge a lockfile-touching PR without
#    `@dependabot rebase` (and the refreshed lockfile) first. A stale base is
#    exactly what lets the textual merge duplicate YAML blocks.
# 2. SERIAL MERGES — merge one such PR at a time, and only after the previous
#    one is fully merged and its main run is green.
# 3. "NO CHECKS REPORTED" MEANS SYNC, NOT WAIT — a branch GitHub cannot build a
#    merge commit for (CONFLICTING/DIRTY) gets NO `pull_request` workflow run at
#    all, so there is no run to wait for. Rebase/sync the branch, then wait for
#    the run that appears.
# 4. LET EVERY MAIN RUN FINISH — ci.yml's `ci-…` concurrency group cancels
#    superseded runs, so a rapid follow-up merge can cancel (and thereby mask)
#    a red run on main. Do not stack merges on top of a run that is still
#    going.
# =============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    # Toolchain packages that vite-plus OWNS must never be bumped by the bot:
    # vite-plus bundles its own vitest, and a mismatched coverage provider makes
    # Vitest run mixed versions and print unreliable coverage (the unit job
    # fails closed on exactly this drift). Pin it to the bundled version by hand
    # whenever vite-plus itself moves.
    ignore:
      - dependency-name: "@vitest/coverage-v8"
        # vite-plus, not npm, decides this version. See AGENTS.md ("Do not
        # install Vitest, Oxlint, Oxfmt or tsdown directly") and the
        # vite-plus bump policy further down this file.
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    # Group all non-major updates into one PR per week to reduce noise;
    # majors and security patches still come as individual PRs.
    groups:
      # NOTE — `@tanstack/start-server-core` is exactly pinned in package.json
      # (both as a dependency and in `pnpm.overrides`) so the server-fn error
      # transport is a deliberate decision, never a silent side effect of a
      # group. Since 1.169.39 a thrown server-fn error is serialized into a 200
      # JSON envelope (`x-tss-serialized`) instead of a 5xx — the client still
      # throws after deserialization, but any raw-HTTP assertion or monitor
      # must read the payload, not the status (see tests/e2e/ownership-transfer).
      tanstack:
        patterns:
          - "@tanstack/*"
      prisma:
        patterns:
          - "@prisma/*"
          - prisma
      radix:
        patterns:
          - "@radix-ui/*"
          - radix-ui
      # react and react-dom must move together: React refuses to run when the
      # two versions differ ("Incompatible React versions"), which failed every
      # component test when the bot bumped only `react` (PR #362). The types
      # pair is named explicitly here and excluded from `types` below, because
      # an overlapping pattern is resolved by whichever group matches first —
      # one atomic PR is the only reliable shape.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        patterns:
          - vitest
          - "@vitest/*"
          - "@vitejs/*"
          - "@rsbuild/*"
          - "@testing-library/*"
        exclude-patterns:
          # vite-plus (and its `vite` alias override) must NEVER be grouped
          # with routine dev-tooling bumps: a 2026-08-30 upgrade of this exact
          # package broke production with an ARM64-only SSR crash invisible to
          # x86_64 CI (see docs/adr's dependency-upgrade-hazards notes), and a
          # grouped PR silently re-bundling it recurred on 2026-09-10. Any
          # vite-plus bump must land as its own isolated, individually-Reviewed
          # PR, verified with a native ARM64 build+boot test on the prod VM
          # before merging — never auto-merged as part of a routine group.
          - vite-plus
          - vite
      better-auth:
        patterns:
          - better-auth
          - "@better-auth/*"
    labels:
      - dependencies

    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - ci
